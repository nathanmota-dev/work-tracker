appId: dev.nathanmota.worktracker
productName: Work Tracker
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
linux:
  target: AppImage
  category: Office
win:
  target: nsis
mac:
  target: dmg

extraResources:
  - from: resources
    to: work-tracker
  - from: out/cli
    to: work-tracker/cli
