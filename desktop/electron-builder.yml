appId: dev.nathanmota.worktracker
productName: Work Tracker
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
linux:
  target: AppImage
  # Stable, space-free names: electron-updater matches the architecture in the file name.
  artifactName: work-tracker-${version}-${arch}.${ext}
  category: Office
publish:
  provider: github
  owner: nathanmota-dev
  repo: work-tracker
  channel: latest
  releaseType: release
win:
  target: nsis
mac:
  target: dmg

extraResources:
  - from: resources
    to: work-tracker
  - from: out/cli
    to: work-tracker/cli
