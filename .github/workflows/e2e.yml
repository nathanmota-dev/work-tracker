name: Electron E2E
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: electron-e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit
      - name: Install system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 latexmk texlive-latex-base poppler-utils
      - name: Build and test Electron
        run: xvfb-run -a npm run test:e2e
      - name: Upload report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
