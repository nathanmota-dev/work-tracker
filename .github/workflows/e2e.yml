name: Electron E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: electron-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 latexmk texlive-latex-base poppler-utils
      - name: Build and test Electron
        run: xvfb-run -a npm run test:e2e
      - name: Upload report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
