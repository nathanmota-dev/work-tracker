name: Performance

# Measures the PR base and the PR head back to back in the same job, so both
# numbers come from the same runner. No benchmark baseline is committed. The
# base's benchmark runner and gate measure and judge both trees, so a PR cannot
# weaken the rule it is judged by; the PR's own scripts are covered by test:infra.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: performance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Microbenchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_MEASUREMENT: ${{ github.workspace }}/base-benchmarks.json
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pull request base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: pr-base
          persist-credentials: false

      - name: Select benchmark layers
        id: changes
        working-directory: pr-head
        run: node scripts/ci/benchmark-layers.cjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            pr-head/package-lock.json
            pr-base/package-lock.json

      - name: Restore Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pr-head/package-lock.json', 'pr-base/package-lock.json') }}

      - name: Install head dependencies
        working-directory: pr-head
        run: npm ci --prefer-offline --no-audit

      - name: Test gate scripts
        id: infra
        continue-on-error: true
        working-directory: pr-head
        run: npm run test:infra

      - name: Install base dependencies
        if: steps.changes.outputs.layers != ''
        working-directory: pr-base
        run: npm ci --prefer-offline --no-audit

      - name: Base microbenchmarks
        id: base
        if: steps.changes.outputs.layers != ''
        continue-on-error: true
        working-directory: pr-base
        env:
          LAYERS: ${{ steps.changes.outputs.layers }}
        run: |
          if grep -q -- '"--capture"' scripts/benchmark-gate.cjs; then
            for layer in ${LAYERS//,/ }; do node scripts/ci/benchmark.cjs "$layer"; done
            node scripts/benchmark-gate.cjs --capture "$BASE_MEASUREMENT" --projects "$LAYERS"
          else
            # Transition: a base from before same-runner comparison only captures both layers.
            echo "::notice::The PR base predates same-runner comparison; measuring both layers with its bootstrap mode."
            for layer in backend frontend; do node scripts/ci/benchmark.cjs "$layer"; done
            node scripts/benchmark-gate.cjs --bootstrap
            cp reports/benchmark-candidate-baseline.json "$BASE_MEASUREMENT"
          fi

      - name: Use the base's benchmark runner and gate
        if: steps.changes.outputs.layers != ''
        run: |
          cp pr-base/scripts/benchmark-gate.cjs pr-head/scripts/benchmark-gate.cjs
          cp pr-base/scripts/ci/benchmark.cjs pr-base/scripts/ci/common.cjs pr-head/scripts/ci/

      - name: Head microbenchmarks
        id: head
        if: steps.changes.outputs.layers != ''
        continue-on-error: true
        working-directory: pr-head
        env:
          LAYERS: ${{ steps.changes.outputs.layers }}
        run: |
          for layer in ${LAYERS//,/ }; do node scripts/ci/benchmark.cjs "$layer"; done

      - name: Compare head with base
        id: gate
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: pr-head
        env:
          LAYERS: ${{ steps.changes.outputs.layers }}
        run: |
          export BENCHMARK_BASELINE_LABEL="main@${BASE_SHA:0:12} (measured on this runner)"
          if [[ -n "$LAYERS" ]]; then
            node scripts/benchmark-gate.cjs --baseline "$BASE_MEASUREMENT" --projects "$LAYERS"
          else
            node scripts/benchmark-gate.cjs --projects ""
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f pr-head/reports/performance.md ]]; then
            cat pr-head/reports/performance.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Performance\n\n**ERROR** — The report was not generated.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            base-benchmarks.json
            pr-base/reports/benchmarks/
            pr-head/reports/benchmarks/
            pr-head/reports/performance.md
            pr-head/reports/performance.json

      - name: Enforce blocking performance checks
        if: always()
        env:
          SELECTED: ${{ steps.changes.outputs.layers }}
          INFRA: ${{ steps.infra.outcome }}
          BASE: ${{ steps.base.outcome }}
          HEAD: ${{ steps.head.outcome }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          failures=()
          [[ "$INFRA" == "success" ]] || failures+=("gate script tests")
          [[ -z "$SELECTED" || "$BASE" == "success" ]] || failures+=("base microbenchmarks")
          [[ -z "$SELECTED" || "$HEAD" == "success" ]] || failures+=("head microbenchmarks")
          [[ "$GATE" == "success" ]] || failures+=("benchmark comparison")
          if (( ${#failures[@]} > 0 )); then
            printf 'Blocking performance checks failed: %s\n' "${failures[*]}"
            exit 1
          fi
